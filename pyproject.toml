[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa-emgw-inference"
version = "0.1.0"
description = "Controlled EM-GW multisource experiments and analytic validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sampler = ["eryn"]
native = ["gbgpu", "ellc", "eryn"]
test = ["pytest>=7"]

[project.scripts]
lisa-emgw = "lisa_emgw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
